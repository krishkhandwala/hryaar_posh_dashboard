services:
  - type: web
    name: hryaar-posh-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        value: hryaar-posh-prod-secret-key-2026-superadmin-cluster
      - key: CLUSTER_NODE_ID
        value: api-worker-prod-1
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

