# ==============================================================================
# HRYAAR DIGI-POSH: TIER 1 API GATEWAY & LOAD BALANCER (NGINX)
# ==============================================================================

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Concurrency Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;
    server_tokens off;

    # Distributed edge rate-limiting zones for 100+ concurrent user resilience
    limit_req_zone $binary_remote_addr zone=api_edge:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=billing_edge:10m rate=10r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # UPSTREAM APPLICATION CLUSTER (TIER 2 LOAD BALANCER)
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        least_conn; # Load balance based on least active connections
        server backend-api-1:8000 max_fails=3 fail_timeout=10s;
        server backend-api-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_edge {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # OWASP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Upstream-Node $upstream_addr always;

        # Liveness & Readiness Probes (Passive + Active Failover)
        location ~ ^/health(/live|/ready)?$ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Strict Auth Brute-Force Edge Protection
        location /api/v1/auth/ {
            limit_req zone=auth_edge burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        }

        # Billing & Webhook Protection
        location /api/v1/billing/ {
            limit_req zone=billing_edge burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        }

        # API Gateway Route (Load balanced across Tier 2 cluster)
        location /api/ {
            limit_req zone=api_edge burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_read_timeout 90;
            proxy_connect_timeout 10;
        }

        # Static Uploads Route
        location /static/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Presentation Tier (Frontend Web Application)
        location / {
            proxy_pass http://frontend_edge;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
